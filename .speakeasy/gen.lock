examples:
  login:
    speakeasy-default-login:
      requestBody:
        application/json: {"type": "apiKey"}
      responses:
        "200":
          application/json: {}
        5XX:
          application/json: {}
        default:
          application/json: {}
  listDrinks:
    speakeasy-default-list-drinks:
      responses:
        "200":
          application/json: [{"name": "Negroni", "price": 1200, "productCode": "AC-A2DF3"}, {"name": "Old Fashioned", "price": 1500, "productCode": "NAC-3F2D1"}, {"name": "Manhattan", "price": 1500, "productCode": "AC-A2DF3"}]
        5XX:
          application/json: {}
        default:
          application/json: {}
  getDrink:
    speakeasy-default-get-drink:
      parameters:
        path:
          name: "<value>"
      responses:
        "200":
          application/json: {"name": "Manhattan", "price": 1000, "productCode": "NAC-3F2D1"}
        5XX:
          application/json: {}
        default:
          application/json: {}
  stockUpdate:
    speakeasy-default-stock-update:
      requestBody:
        application/json: {"drink": {"name": "Negroni", "price": 1200, "productCode": "NAC-3F2D1"}, "ingredient": {"name": "Angostura Bitters", "type": "fresh", "productCode": "AC-A2DF3"}}
      responses:
        5XX:
          application/json: {}
        default:
          application/json: {}
  listIngredients:
    speakeasy-default-list-ingredients:
      responses:
        "200":
          application/json: [{"name": "Angostura Bitters", "type": "fresh", "stock": 5, "productCode": "AC-A2DF3"}, {"name": "Orange Peel", "type": "fresh", "stock": 0, "productCode": "AC-A2DF3"}]
        5XX:
          application/json: {}
        default:
          application/json: {}
  getIngredient:
    speakeasy-default-get-ingredient:
      parameters:
        path:
          name: "<value>"
      responses:
        "200":
          application/json: {"name": "Orange Peel", "type": "fresh", "stock": 0, "productCode": "AC-A2DF3"}
        5XX:
          application/json: {}
        default:
          application/json: {}
  createOrder:
    speakeasy-default-create-order:
      requestBody:
        application/json: {"type": "ingredient", "productCode": "AC-A2DF3", "quantity": 567805}
      responses:
        "200":
